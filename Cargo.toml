[workspace]
members = [
  "crates/palimpsest-application",
  "crates/palimpsest-cache",
  "crates/palimpsest-conformance",
  "crates/palimpsest-domain",
  "crates/palimpsest-embedded",
  "crates/palimpsest-http",
  "crates/palimpsest-postgres",
  "crates/palimpsest-server",
  "crates/palimpsest-stores",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mustbearnold/palimpsest"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.9"
hex = "0.4.3"
hmac = "0.12.1"
http-body = "1.0.1"
pgvector = { version = "0.4.2", features = ["sqlx"] }
redis = { version = "1.5.0", default-features = false, features = ["connection-manager", "tokio-comp"] }
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "uuid"] }
thiserror = "2.0.18"
time = { version = "0.3.54", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde", "v5", "v7"] }
