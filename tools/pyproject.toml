[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palimpsest-mcp"
version = "0.1.0"
description = "Local MCP adapter for the Palimpsest temporal memory service (MCP over HTTP; never connects to PostgreSQL directly)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
palimpsest-mcp = "palimpsest_mcp:main"

[tool.setuptools]
py-modules = ["palimpsest_mcp"]

[tool.setuptools.packages.find]
where = ["../clients/python/src"]
