[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palimpsest-client"
version = "0.1.0"
description = "Dependency-free Python client for the Palimpsest temporal memory service"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "../../LICENSE"}
authors = [{name = "Palimpsest contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
